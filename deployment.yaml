apiVersion: apps/v1
kind: Deployment
metadata:
  name: aks-deployment1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aks-dep 
  template:
    metadata:
      labels:
        app: aks-dep
  spec:
    containers:
    -  name: aks-dep-cont1
       image: acrdemo1.azure.io/aks-image:v1
       ports:
       -  containerPort: 80